services:
  postgres:
    image: postgres:16-alpine
    container_name: movievault-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: movievault
      POSTGRES_PASSWORD: movievault
      POSTGRES_DB: movievault
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U movievault -d movievault"]
      interval: 5s
      timeout: 5s
      retries: 12

volumes:
  pgdata:
